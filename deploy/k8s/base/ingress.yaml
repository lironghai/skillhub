apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skillhub
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
spec:
  ingressClassName: nginx
  rules:
    - host: skills.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: skillhub-server
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skillhub-web
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skillhub-mcp
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: skills.example.com
      http:
        paths:
          - path: /api/mcp
            pathType: Exact
            backend:
              service:
                name: skillhub-server
                port:
                  number: 8080
          - path: /contextforge
            pathType: Prefix
            backend:
              service:
                name: skillhub-web
                port:
                  number: 80
